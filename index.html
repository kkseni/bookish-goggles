<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/bookish-goggles/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla App Template</title>
    <script type="module" crossorigin src="/bookish-goggles/index.js"></script>
    <link rel="stylesheet" crossorigin href="/bookish-goggles/assets/styles-BECYXfET.css">
  </head>
  <body>
     <header class="header">
    <div class="header-container container">
      <nav class="navigation">
        <a href="./index.html" class="header-logo"><img src="../img/logo.png" alt="Logo" /> Product</a>
        <ul class="nav-list">
          <li class="nav-list-item">
            <a href="./index.html" class="nav-list-link active">Product</a>
          </li>
          <li class="nav-list-item">
            <a href="./pricing.html" class="nav-list-link">Pricing</a>
          </li>
          <li class="nav-list-item">
            <a href="./customers.html" class="nav-list-link">Customers</a>
          </li>
          <li class="nav-list-item">
            <a href="./resourses.html" class="nav-list-link">Resources</a>
          </li>
        </ul>
      </nav>

      <ul class="header-list-btn">
        <li class="header-list-item">
          <button type="button" class="header-btn-sign">Sign in</button>
        </li>
        <li class="header-list-item">
          <button type="button" class="header-btn-signup">Sign up</button>
        </li>
      </ul>
    </div>
  </header>

    <main>
      <!-- Loads the specified .html file -->
      <section class="vite-promo">
  <div class="container">
    <div class="vite-promo-thumb">
      <a
        class="vite-promo-link"
        href="https://vitejs.dev/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Link to Vite official website"
        title="Vite.js  build tool"
      >
        <!-- Path to images as from index.html file -->
        <img
          class="pic"
          src="/bookish-goggles/assets/vite-logo-9o_aqrTe.png"
          alt="Vite logo"
          width="640"
          height="640"
        />
      </a>
    </div>
    <h1 class="main-title">
      <span class="main-title-gradient">Vite</span>
      Template by
      <a
        class="main-title-link"
        href="https://github.com/goitacademy/vanilla-app-template"
        target="_blank"
        rel="noopener noreferrer"
      >
        GoIT
      </a>
    </h1>
  </div>
</section>

      <article class="badges">
  <div class="container">
    <ul class="badges-list">
      <li class="badges-item">
        <a
          class="badges-link"
          href="https://www.npmjs.com/package/vite-plugin-html-inject"
          target="_blank"
          rel="noopener noreferrer"
        >
          HTML Inject
        </a>
      </li>
      <li class="badges-item">
        <a
          class="badges-link"
          href="https://www.npmjs.com/package/vite-plugin-full-reload"
          target="_blank"
          rel="noopener noreferrer"
        >
          Full Reload
        </a>
      </li>
      <li class="badges-item">
        <a
          class="badges-link"
          href="https://www.npmjs.com/package/postcss-sort-media-queries"
          target="_blank"
          rel="noopener noreferrer"
        >
          Sort Media Queries
        </a>
      </li>
    </ul>
  </div>
</article>

    </main>

    <footer class="footer">
  <div class="container">
    <p class="footer-desc">
      Made with ✨ by
      <a
        class="footer-link"
        href="https://goit.global/ua/"
        target="_blank"
        rel="noopener noreferrer"
      >
        GoIT team
      </a>
    </p>
  </div>
</footer>


  </body>
</html>
